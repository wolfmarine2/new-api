name: Build and Push Multi-Arch Docker Image

on:
  # 支持在 GitHub Actions 页面手动运行
  workflow_dispatch:

  push:
    # main 分支更新时构建 latest
    branches:
      - main

    # 创建 v 开头的标签时发布对应版本
    # 例如 v0.13.2
    tags:
      - "v*"

# 1. 增加 packages: write 权限，允许推送到 GHCR
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build amd64 and arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 使用 QEMU 模拟不同 CPU 架构
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # 启用 Docker Buildx 多架构构建
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. 修改为登录 GHCR (使用内置系统 Token，不需要在 Repo Secrets 手动填密码)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 修改镜像名称前缀为 ghcr.io/<username>/<repo>
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,prefix=sha-

      # 构建 amd64 和 arm64，并推送到 GHCR
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Build and Push Multi-Arch Docker Image

on:
  # 支持在 GitHub Actions 页面手动运行
  workflow_dispatch:
  push:
    # 分支更新时构建（分支名即镜像 tag）
    branches:
      - v0.13.3
    # 打 git tag 时也构建（tag 名即镜像 tag）
    tags:
      - 'v*'

# 需要 packages: write 权限才能推送到 GHCR
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build amd64 and arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 使用 QEMU 模拟不同 CPU 架构
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # 启用 Docker Buildx 多架构构建
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR（使用内置 GITHUB_TOKEN，无需手动配置 Secrets）
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成镜像标签：
      #   - ref_name：分支推送时为 v0.13.3，tag 推送时为 tag 名
      #   - latest：仅在默认分支推送时更新，避免发版分支抢占
      #   - sha-xxxxxxx：便于精确回滚
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # 构建 amd64 和 arm64 并推送到 GHCR
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
